# Rewynd — Slack app manifest.
# Use this to recreate the app in your Developer Program SANDBOX:
#   api.slack.com/apps → Create New App → "From an app manifest" → pick the
#   sandbox workspace → paste this → Create.
# After creating: generate an App-Level Token (connections:write), install to get
# the bot token, and enable "Agents & AI Apps" so events carry the action_token.
display_information:
  name: Rewynd
  description: Institutional-memory incident responder — recovers how your team fixed this before.
  background_color: "#1a1d29"
features:
  bot_user:
    display_name: Rewynd
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
      - files:write
      - search:read.public
      - search:read.private
      - search:read.im
      - search:read.mpim
      - search:read.files
      - search:read.users
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
